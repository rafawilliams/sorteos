<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería de Panamá — Estadísticas & Predicciones</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="bg-orbs" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

{% if not react_built %}
<div class="build-notice" role="alert">La interfaz React no está construida. Ejecuta <code>npm --prefix frontend ci &amp;&amp; npm --prefix frontend run build</code> y recarga la página.</div>
{% endif %}

<!-- La interfaz entera la pinta React en #root (frontend/src/shell/Armazon.tsx); esto se ve hasta que carga el script. -->
<div id="root">
  <div class="loader-wrap" role="status" aria-label="Cargando"><div class="spinner" aria-hidden="true"></div><p>Cargando datos de sorteos…</p></div>
</div>

{% if react_built %}<script type="module" src="{{ url_for('static', filename='dist/app.js') }}"></script>{% endif %}
</body>
</html>
